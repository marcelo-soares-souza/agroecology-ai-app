name: agroecology_map_ai
description: "Agroecology Map AI — Mobile app for Android and iPhone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.7
  image_picker: ^1.2.0
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
